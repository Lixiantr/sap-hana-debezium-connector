# Performance fragment for the Apache Kafka Connect worker. Merge it with
# secured broker, TLS, ACL and internal-topic configuration; it does not replace them.
key.converter=io.hanacdc.connect.CachedSchemaJsonConverter
key.converter.schemas.enable=true
key.converter.schemas.cache.size=1000
value.converter=io.hanacdc.connect.CachedSchemaJsonConverter
value.converter.schemas.enable=true
value.converter.schemas.cache.size=1000
producer.compression.type=lz4
producer.batch.size=1048576
producer.linger.ms=5
producer.buffer.memory=134217728
producer.max.request.size=1114112
