name=hana-java-connector
connector.class=io.hanacdc.connect.HanaSourceConnector
tasks.max=1

server.name=hana-source-01
topic=hana.cdc.cdc_schema.cdc_table
run.id=STREAMING-RUN-001
first.position=0
last.position=9223372036854775807
prototype.mode=false
snapshot.mode=no_data
state.dir=/var/lib/hana-cdc/state
state.max.uncommitted.generations=65536
state.max.uncommitted.bytes=4294967296

log.backup.discovery.mode=catalog
database.connection.url=jdbc:sap://hana-tenant.internal:39041/?databaseName=HANA_TENANT
database.jdbc.driver=com.sap.db.jdbc.Driver
database.user=HANA_CDC_READER
database.password=${file:/opt/kafka/secrets/hana.properties:password}
log.backup.path.mapping=/hana/backup/log/DB_HANA_TENANT=/mnt/hana-log-backups
source.id=2
source.volume.id=2
source.partition.id=0
source.topology.mode=single_container
source.topology.change.policy=fail
# Multi-host scale-out is unsupported for publication.
# source.topology.mode=scale_out
# source.scale.out.start.positions=2=1000000,3=2000000
# source.scale.out.catalog.threads=4
# log.backup.scale.out.path.mapping=2@/hana/shared/log/DB=/mnt/hana-node-a/log;3@/hana/shared/log/DB=/mnt/hana-node-b/log
control.query.timeout.seconds=30
control.policy.refresh.interval.ms=10000
control.policy.max.staleness.ms=60000
log.backup.retention.min.seconds=7200
log.backup.retention.safety.margin.seconds=900
log.backup.max.publication.delay.ms=900000
log.backup.max.bytes=69793218560
hana.version.supported.prefixes=2.00.088
errors.hana.policy.mode=fail

# DBA/storage contract, not a HANA backup-creation setting: successful catalog
# entries and physical objects must remain readable for at least 7200 seconds.
# The connector validates retention but does not perform cleanup.

heartbeat.interval.ms=30000
topic.heartbeat.prefix=__debezium-heartbeat
# topic.heartbeat.name=__debezium-heartbeat.hana-source-01

log.processor.threads=auto
log.processor.max.threads=6
log.processor.chunks.per.thread=4
poll.max.batch.size=4096
poll.interval.ms=250

transaction.buffer.max.open=4096
transaction.buffer.max.rows=100000
transaction.buffer.max.bytes=67108864
lob.buffer.max.bytes=67108864
lob.max.bytes=16777216
lob.max.open.locators=1024
event.max.bytes=1048576

database.name=HANA_TENANT
schema.name=CDC_SCHEMA
table.name=CDC_TABLE
table.include.list=CDC_SCHEMA\\.CDC_TABLE
